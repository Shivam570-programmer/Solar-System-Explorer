float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
float fbm3(vec3 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
vec3 hash3(vec3 p){ p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6))); return fract(sin(p)*43758.5453); }
vec3 tone(vec3 c){ c = 1. - exp(-c*1.15); return pow(c, vec3(.4545)); }
`;

// ----- Sun surface: the reference fragment shader, applied to a real 3D sphere -----
const SUN_VS = `
varying vec3 vObj; varying vec3 vN; varying vec3 vV;
void main(){ vObj = normalize(position); vec4 mv = modelViewMatrix*vec4(position,1.); vN = normalize(normalMatrix*normal); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`;
const SUN_FS = `precision highp float;
uniform float evo, fade;
varying vec3 vObj; varying vec3 vN; varying vec3 vV;
${NOISE}
void main(){
  vec3 q = vObj;
  float freq = 3.4, warp = 1.1;
  vec3 c0 = vec3(1.,.26,.01), c1 = vec3(2.3,1.,.12), c2 = vec3(3.6,2.9,1.3), glow = vec3(1.8,.68,.1);
  float w1 = fbm(q*freq + vec3(0.,0.,evo*.28)), w2 = fbm(q*freq*.9 + 7. - vec3(evo*.22,0.,0.));
  float v = fbm(q*freq*1.7 + warp*2.2*vec3(w1, w2, w1-w2));
  float s = smoothstep(.24,.76,v);
  vec3 c = mix(c0, c1, smoothstep(.0,.55,s));
  c = mix(c, c2, smoothstep(.5,1.,s));
  float mu = clamp(dot(normalize(vN), normalize(vV)), 0., 1.);
  c *= mix(.34, 1., pow(mu,.5));
  c += glow*pow(1.-mu,2.6)*.42;
  gl_FragColor = vec4(tone(c)*fade, 1.);
}`;

// ----- Tight halo, ends completely a short way off the star -----
const HALO_VS = `varying vec2 vP; uniform float hs;
void main(){ vP = position.xy*hs; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const HALO_FS = `precision highp float;
uniform float evo, flick, fade; varying vec2 vP;
${NOISE}
void main(){
  float d = length(vP), e = max(d-1., 0.);
  vec2 dir = vP/max(d,1e-4);
  float rays = .72 + .56*fbm(vec3(dir*2.4, evo*.5));
  float hal = exp(-e/.11)*smoothstep(.6,.12,e);
  vec3 col = vec3(1.8,.68,.1)*.7*hal*rays*flick;
  gl_FragColor = vec4(tone(col)*fade, 1.);
}`;

// ----- Planets: one shader, six surface modes, lit from the Sun at the origin -----
const PL_VS = `
varying vec3 vObj; varying vec3 vNW; varying vec3 vPW;
void main(){ vObj = normalize(position); vNW = normalize(mat3(modelMatrix)*normal); vec4 wp = modelMatrix*vec4(position,1.); vPW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`;
const PL_FS = `precision highp float;
uniform int mode; uniform vec3 cA, cB, cC, atm; uniform float f, as, t, spot, sunI;
varying vec3 vObj; varying vec3 vNW; varying vec3 vPW;
${NOISE}
float craters(vec3 p){
  vec3 i = floor(p), fr = fract(p); float res = 0.;
  for(int x=-1;x<=1;x++) for(int y=-1;y<=1;y++) for(int z=-1;z<=1;z++){
    vec3 g = vec3(float(x),float(y),float(z)); vec3 o = hash3(i+g);
    if(o.y < .4) continue;
    float rr = .1 + .3*o.z, d = length(g + o*.8 + .1 - fr);
    res += (smoothstep(rr*1.3, rr, d) - smoothstep(rr, rr*.78, d))*.9 - smoothstep(rr*.85, rr*.3, d)*.55;
  }
  return res;
}
void main(){
  vec3 n = normalize(vObj), N = normalize(vNW);
  vec3 L = normalize(-vPW), V = normalize(cameraPosition - vPW);
  float lat = n.y, al_spec = 0.;
  vec3 al = cA;
  if(mode == 0){
    float b = fbm(n*f*1.3), c = craters(n*f*1.6) + .6*craters(n*f*4.);
    al = mix(cA, cB, smoothstep(.25,.75,b)); al = mix(al, cC, smoothstep(.55,.9,b)*.5);
    al *= clamp(1. + c*.55, .35, 1.7);
  } else if(mode == 1){
    vec3 q = vec3(n.x, n.y*2.4, n.z);
    float w = fbm3(q*f + vec3(0.,0.,t*.02)); float v = fbm(q*f*1.5 + 2.*w + vec3(t*.015,0.,0.));
    al = mix(cA, cB, smoothstep(.2,.7,v)); al = mix(al, cC, smoothstep(.55,.95,v)*.7);
  } else if(mode == 2){
    float land = fbm(n*f*1.15 + 3.1); float m = smoothstep(.5,.54,land);
    float depth = smoothstep(.2,.52,land);
    vec3 ocean = mix(cA, cB, depth);
    float dry = fbm3(n*5.+1.)*.7 + (1.-abs(lat))*.5;
    vec3 ground = mix(vec3(.08,.2,.07), vec3(.5,.42,.22), smoothstep(.5,.95,dry));
    ground = mix(ground, vec3(.62,.6,.55), smoothstep(.6,.72,land)*.5);
    al = mix(ocean, ground, m);
    float ice = smoothstep(.8,.9, abs(lat) + (fbm3(n*6.)-.5)*.2); al = mix(al, vec3(.92,.95,1.), ice);
    float cr = cos(t*.03), sr = sin(t*.03); vec3 cn = vec3(n.x*cr+n.z*sr, n.y, -n.x*sr+n.z*cr);
    float cl = smoothstep(.5,.78, fbm(cn*3.4 + vec3(0.,t*.01,0.)) + (1.-abs(lat))*.04);
    al_spec = (1.-m)*(1.-ice)*(1.-cl);
    al = mix(al, vec3(1.), cl*.88);
  } else if(mode == 3){
    float b = fbm(n*f), d = fbm3(n*f*2.4 + 4.);
    al = mix(cA, cB, smoothstep(.3,.7,b)); al = mix(al, cC, smoothstep(.55,.9,d)*.55);
    al = mix(al, cA*.7, smoothstep(.55,.75,fbm3(n*f*.8+9.))*.6);
    float cap = smoothstep(.86,.93, abs(lat) + (fbm3(n*7.)-.5)*.1); al = mix(al, vec3(.95,.93,.92), cap);
  } else if(mode == 4){
    float w = fbm3(vec3(n.x*3., n.y*.5, n.z*3.) + vec3(0.,0.,t*.01));
    float band = sin(lat*f*9. + w*3.2 + fbm3(vec3(n.x*2.,n.y*8.,n.z*2.))*2.2)*.5 + .5;
    float fine = fbm(vec3(n.x*4.,n.y*26.,n.z*4.) + w);
    al = mix(cA, cB, band); al = mix(al, cC, smoothstep(.5,.9,fine*.7+band*.4)*.65);
    if(spot > 0.){
      vec3 sd = n - normalize(vec3(.92,-.3,.25)); float sp = smoothstep(1., .0, length(sd*vec3(1.,2.4,1.))/.3);
      al = mix(al, vec3(.7,.25,.12), sp*sp*spot);
    }
  } else {
    float band = sin(lat*f*6. + fbm3(vec3(n.x*2.,n.y*3.,n.z*2.))*1.5)*.5+.5;
    float v = fbm(n*f*2.2 + vec3(t*.01,0.,0.));
    al = mix(cA, cB, band*.6 + v*.5); al = mix(al, cC, smoothstep(.55,.95,v)*.35 + (1.-abs(lat))*.08);
  }
  float nl = dot(N, L);
  float lam = smoothstep(-.08, .85, nl);
  vec3 col = al*(lam*1.35*sunI + .012);
  if(al_spec > 0.){ vec3 R = reflect(-L, N); col += vec3(.8,.9,1.)*pow(max(dot(R,V),0.), 50.)*.7*al_spec*sunI*step(0.,nl); }
  float fr = pow(1. - max(dot(N,V),0.), 3.);
  col += atm*as*fr*smoothstep(-.35,.55,nl)*1.25*sunI;
  gl_FragColor = vec4(tone(col), 1.);
}`;

// ----- Rings -----
const RING_VS = `varying vec3 vPW; varying float vR; void main(){ vR = length(position.xy); vec4 wp = modelMatrix*vec4(position,1.); vPW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`;
const RING_FS = `precision highp float;
uniform vec3 pc, tint; uniform float pr, rin, rout, thin, sunI;
varying vec3 vPW; varying float vR;
${NOISE}
void main(){
  float u = (vR - rin)/(rout - rin);
  float a;
  if(thin > .5){
    a = 0.;
    a += smoothstep(.02,0.,abs(u-.18))*.5 + smoothstep(.015,0.,abs(u-.42))*.6 + smoothstep(.02,0.,abs(u-.66))*.5 + smoothstep(.03,0.,abs(u-.9))*.9;
    a *= .35;
  } else {
    float g = n3(vec3(u*90.,1.,2.))*.6 + n3(vec3(u*260.,3.,4.))*.4;
    a = smoothstep(0.,.04,u)*smoothstep(1.,.96,u);
    a *= mix(.25, 1., g);
    a *= 1. - .85*smoothstep(.035,0.,abs(u-.665));
    a *= mix(.45, 1., smoothstep(.0,.3,u));
  }
  vec3 L = normalize(-vPW);
  vec3 d = vPW - pc; float b = dot(d, L), c = dot(d,d) - pr*pr;
  float sh = (b < 0. && b*b - c > 0.) ? .08 : 1.;
  vec3 col = tint*(.75 + .5*n3(vec3(u*40.,5.,6.)))*sh*sunI*1.5;
  gl_FragColor = vec4(tone(col), a);
}`;

// ----- Backdrop nebula + dust lane (a faint band, mostly black) -----
const NEB_VS = `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*mat4(mat3(viewMatrix))*vec4(position,1.)*1.; gl_Position.z = gl_Position.w*.9999; }`;
const NEB_FS = `precision highp float;
uniform float t; varying vec3 vD;
${NOISE}
void main(){
  vec3 d = normalize(vD);
  float cr = cos(t*.004), sr = sin(t*.004); vec3 p = vec3(d.x*cr+d.z*sr, d.y, -d.x*sr+d.z*cr);
  vec3 bn = normalize(vec3(.25,1.,.35));
  float band = exp(-pow(dot(p,bn)*2.6, 2.));
  float cl = fbm(p*2.2 + 3.);
  float cl2 = fbm(p*5.5 + cl*2. + 11.);
  float dens = smoothstep(.35,.85, cl*.75 + cl2*.45) * (.25 + band*1.1);
  vec3 col = mix(vec3(.28,.07,.4), vec3(.06,.3,.45), smoothstep(.3,.8,fbm3(p*1.6+7.)));
  col = mix(col, vec3(.7,.28,.14), smoothstep(.62,.9,cl2)*band*.7);
  float dust = smoothstep(.45,.75, fbm(p*7. + 2.)) * band;
  col *= dens*.17;
  col *= 1. - dust*.7;
  col += vec3(.5,.55,.75)*band*band*fbm3(p*18.)*.03;
  gl_FragColor = vec4(tone(col), 1.);
}`;

// ----- Points -----
const STAR_VS = `attribute float size; attribute float ph; attribute vec3 col; uniform float px, t; varying vec3 vC; varying float vA;
void main(){ vC = col; vA = .65 + .35*sin(t*(.6+ph*1.6) + ph*40.); vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv; gl_PointSize = size*px; }`;
const STAR_FS = `precision highp float; varying vec3 vC; varying float vA;
void main(){ float d = length(gl_PointCoord-.5)*2.; float a = smoothstep(1.,.0,d); a = a*a; gl_FragColor = vec4(vC*a*vA, 1.); }`;
const DUST_VS = `attribute float ph; uniform float px, size, t, atten; varying float vA;
void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv; float s = mix(1., 90./max(-mv.z,1.), atten); gl_PointSize = clamp(size*px*s, 1., 6.*px); vA = .5 + .5*sin(t*.5 + ph*30.); }`;
const DUST_FS = `precision highp float; uniform vec3 color; uniform float alpha; varying float vA;
void main(){ float d = length(gl_PointCoord-.5)*2.; float a = smoothstep(1.,.2,d); gl_FragColor = vec4(color*a*alpha*(.55+.45*vA), 1.); }`;

(function stars(){

const BELT_VS = `attribute vec3 orb; attribute float ph; uniform float px,size,t,st,atten; varying float vA;

  orbit.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lm));
  const pivot = new THREE.Group(); orbit.add(pivot);
  const tiltG = new THREE.Group(); tiltG.rotation.z = B.tilt*D2R; pivot.add(tiltG);
  const mat = planetMaterial(B.look, B.mode, B.id === 'jupiter' ? 1 : 0);
  const mesh = new THREE.Mesh(unitSphere, mat); mesh.scale.setScalar(B.r); tiltG.add(mesh);
  const o = {orbit, pivot, mesh, mat, moons:[], rings:null, lm, pickR:B.r};
  if(B.rings){
    const thin = B.rings === 'thin', rin = B.r*(thin?1.6:1.32), rout = B.r*(thin?2.25:2.4);
    const rm = new THREE.ShaderMaterial({uniforms:{pc:{value:new THREE.Vector3()}, tint:{value:new THREE.Vector3(...(thin?[.55,.7,.75]:[.95,.82,.58]))}, pr:{value:B.r}, rin:{value:rin}, rout:{value:rout}, thin:{value:thin?1:0}, sunI:{value:1.5}},
      vertexShader:RING_VS, fragmentShader:RING_FS, transparent:true, side:THREE.DoubleSide, depthWrite:false});
    const ring = new THREE.Mesh(new THREE.RingGeometry(rin, rout, 192, 1), rm); ring.rotation.x = -Math.PI/2; tiltG.add(ring); o.rings = rm; o.ringOuter = rout;
    o.pickR = rout*.9;
  }
  const mg = new THREE.Group(); mg.rotation.x = (idx%3-1)*.06; pivot.add(mg);
  B.moons.forEach((M, mi) => {
    const mm = planetMaterial({cA:M.col.map(v=>v*.45), cB:M.col, cC:M.col.map(v=>v*1.35), f:4, atm:[0,0,0], as:0}, 0, 0);
    const me = new THREE.Mesh(unitSphere, mm); me.scale.setScalar(M.r); mg.add(me);
    const rad = Math.max(B.r*M.a, (o.ringOuter||0)*1.08 + (mi?0:0)), cpts = [];
    M.rad = B.rings && B.rings !== 'thin' ? Math.max(B.r*M.a, o.ringOuter + M.r*2 + .3 + mi*.8) : B.r*M.a;
    for(let i=0;i<=128;i++){ const A = i/128*Math.PI*2; cpts.push(new THREE.Vector3(Math.cos(A)*M.rad, 0, Math.sin(A)*M.rad)); }
    const mlm = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0, depthWrite:false});
    mg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cpts), mlm));
    M.ph0 = (mi+1)*2.1 + idx; M.mesh = me; M.lm = mlm; M.parent = B;
    if(MOON_INFO[M.n]){ const pk = new THREE.Mesh(pickGeo, new THREE.MeshBasicMaterial({visible:false})); pk.userData = {body:Object.assign({id:M.n.toLowerCase(), name:M.n, r:M.r, tilt:0, spin:.1, moons:[], moon:true, parent:B}, MOON_INFO[M.n], {obj:null})}; scene.add(pk); pickables.push(pk); M.pick = pk; M.body = pk.userData.body; M.body.obj = {pick:pk, moonRef:M}; }
    o.moons.push(M);
  });
  B.obj = o;
  const pk = new THREE.Mesh(pickGeo, new THREE.MeshBasicMaterial({visible:false})); pk.userData = {body:B}; scene.add(pk); pickables.push(pk); o.pick = pk;
});

/* ---------- Per-frame scene update ---------- */
let lineAlpha = .2;
function solveKepler(M, e){ let E = M; for(let i=0;i<6;i++) E = M + e*Math.sin(E); return E; }
function updateScene(st, focusB, dt){
  BODIES.forEach((B, idx) => {
    if(!idx) return;
    const o = B.obj, n = 5.46/Math.pow(B.a,1.15);
    const E = solveKepler(B.M0 + n*st, B.e), b = B.a*Math.sqrt(1-B.e*B.e);
    o.pivot.position.set(B.a*(Math.cos(E)-B.e), 0, b*Math.sin(E));
    o.mesh.rotation.y = st*B.spin*3;
    o.orbit.updateMatrixWorld(true);
    o.pivot.getWorldPosition(tmpV);
    const dist = tmpV.length(), si = 1.55*Math.pow(THREE.MathUtils.clamp(26/dist,.35,2.2),.4);
    o.mat.uniforms.sunI.value = si;
    if(o.rings){ o.rings.uniforms.pc.value.copy(tmpV); o.rings.uniforms.sunI.value = si; }
    o.moons.forEach(M => {
      const ang = M.ph0 + st*(Math.PI*2/Math.abs(M.T))*Math.sign(M.T)*.9;
      M.mesh.position.set(Math.cos(ang)*M.rad, 0, Math.sin(ang)*M.rad); M.mesh.rotation.y = -ang;
      M.mesh.material.uniforms.sunI.value = si;
      const goal = (focusB && (focusB === B || focusB.parent === B)) ? .3 : 0;
      M.lm.opacity += (goal - M.lm.opacity)*(1-Math.exp(-dt*5));
    });
    o.pick.position.copy(tmpV);
  });
  pickables.forEach(pk => { const B = pk.userData.body; if(B.id === 'sun') return;
    if(B.moon){ B.obj.moonRef.mesh.getWorldPosition(pk.position); }
  });
  const goal = focusB ? .07 : .2; lineAlpha += (goal-lineAlpha)*(1-Math.exp(-dt*4));
  lineMats.forEach(m => m.opacity = lineAlpha);
}
function bodyWorldPos(B, out){
  if(B.id === 'sun') return out.set(0,0,0);
  if(B.moon){ B.obj.moonRef.mesh.getWorldPosition(out); return out; }
  B.obj.pivot.getWorldPosition(out); return out;
}

/* ---------- UI: caption, ticks, panel ---------- */
const $ = id => document.getElementById(id);
const capEl = $('cap'), track = $('track'), ticksEl = $('ticks'), panel = $('panel'), ui = $('ui'), backBtn = $('back'), brand = $('brand'), labelEl = $('label');
const OVERVIEW = {t:'Eight planets, one star', b:'The Solar System', c:'4.6 billion years old'};
for(let i=0;i<N;i++) ticksEl.appendChild(document.createElement('i'));
const ticks = [...ticksEl.children], tickH = new Float32Array(N).fill(.2);
function setCaption(o){
  const old = capEl.querySelector('.line:not(.off)');
  const el = document.createElement('div'); el.className = 'line off';
  el.innerHTML = `<h1>${o.t}</h1><p><b>${o.b}</b>${o.c}</p>`;
  capEl.appendChild(el); void el.offsetWidth; el.classList.remove('off');
  if(old){ old.classList.add('off'); setTimeout(() => old.remove(), 240); }
}
setCaption(OVERVIEW);

function panelHTML(B){
  let h = `<div class="kick">${B.kick}</div><h2>${B.name}</h2><div class="tag">${B.c}</div>`;
  h += B.desc.map(p => `<p class="desc">${p}</p>`).join('');
  h += `<dl class="stats">${B.stats.map(s => `<div><dt>${s[0]}</dt><dd>${s[1]}</dd></div>`).join('')}</dl>`;
  h += `<h3>Did you know</h3><ul class="facts">${B.facts.map(f => `<li>${f}</li>`).join('')}</ul>`;
  if(B.moons && B.moons.length) h += `<h3>Moons shown</h3><div class="moons">${B.moons.map(m => MOON_INFO[m.n] ? `<span data-moon="${m.n}" role="button" tabindex="0">${m.n}</span>` : `<span>${m.n}</span>`).join('')}</div>`;
  if(B.moon) h += `<h3>Orbits</h3><div class="moons"><span data-body="${B.parent.id}" role="button" tabindex="0">${B.parent.name}</span></div>`;
  return h;
}
let panelTimer = 0;
function showPanel(B){
  clearTimeout(panelTimer);
  const fill = () => { panel.innerHTML = panelHTML(B); panel.scrollTop = 0; panel.style.setProperty('--acc', B.acc); document.documentElement.style.setProperty('--acc', B.acc); panel.classList.remove('off'); };
  if(panel.classList.contains('off')) fill(); else { panel.classList.add('off'); panelTimer = setTimeout(fill, 230); }
}
function hidePanel(){ clearTimeout(panelTimer); panel.classList.add('off'); }
panel.addEventListener('click', e => {
  const m = e.target.closest('[data-moon]'), b = e.target.closest('[data-body]');
  if(m){ const pk = pickables.find(p => p.userData.body.name === m.dataset.moon); if(pk) focusOn(pk.userData.body); }
  else if(b){ focusOn(BODIES.find(x => x.id === b.dataset.body)); }
});

/* ---------- Camera + focus state ---------- */
const cam = {yaw:.7, pitch:.5, dist:760, distGoal:200, target:new THREE.Vector3(), sx:0, sy:0, yawV:0, pitchV:0};
let focus = null, stage = 0, x = 0, hover = -1, lastInput = 0, paused = false, simT = 0, prevFocusPos = new THREE.Vector3(), prevFocus = null, focusAmt = 0;
const narrow = () => innerWidth <= 760;
function overviewDist(){ const a = innerWidth/innerHeight; return 200*Math.max(1, 1.1/a); }
function bodyR(B){ return B.moon ? B.r : (B.obj.ringOuter || B.r); }
function focusDist(B){
  const a = innerWidth/innerHeight, k = Math.max(1, .85/a);
  if(B.id === 'sun') return B.r*4.8*k;
  return B.moon ? B.r*7*k : bodyR(B)*(B.obj.ringOuter ? 3.8 : 6.3)*k;
}
function clampDist(d){ if(focus){ const R = bodyR(focus); return Math.min(Math.max(d, R*1.9), R*34); } return Math.min(Math.max(d, 16), 520); }
function parentIdx(B){ return BODIES.indexOf(B.moon ? B.parent : B); }
function focusOn(B){
  if(!B || focus === B) return;
  const pi = parentIdx(B), changed = pi !== stage;
  focus = B; stage = pi; x = pi/LAST;
  cam.distGoal = focusDist(B);
  showPanel(B); setCaption({t:B.t, b:B.name, c:B.c});
  backBtn.classList.add('on'); brand.classList.add('off'); $('hint').classList.add('gone');
  if(narrow()) ui.classList.add('away');
  $('e0').classList.toggle('on', pi === 0); $('e1').classList.toggle('on', pi === LAST);
  track.setAttribute('aria-valuenow', pi); track.setAttribute('aria-valuetext', B.name);
  if(changed) cam.yawV += (Math.random() < .5 ? -1 : 1)*.9;
}
function toOverview(){
  if(!focus) return;
  focus = null; cam.distGoal = overviewDist();
  hidePanel(); setCaption(OVERVIEW); backBtn.classList.remove('on'); brand.classList.remove('off'); ui.classList.remove('away');
  $('e0').classList.remove('on'); $('e1').classList.remove('on');
}
backBtn.addEventListener('click', toOverview);
function moveTo(nx){
  nx = Math.min(1, Math.max(0, nx));
  cam.yawV += (nx - x)*18; lastInput = performance.now();
  const i = Math.round(nx*LAST); x = nx;
  if(focus !== BODIES[i]) focusOn(BODIES[i]);
}

/* ---------- Input ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy){ ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(pickables, false); return h.length ? h[0].object.userData.body : null; }
const pointers = new Map(); let down = null, trackDrag = false, pinchD = 0, hoverQueued = false, hx = 0, hy = 0;
const trackPx = e => { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)); };
const onUI = t => t.closest && t.closest('#panel,#back');
window.addEventListener('pointerdown', e => {
  lastInput = performance.now();
  if(e.target.closest('#track')){ trackDrag = true; moveTo(trackPx(e)); return; }
  if(onUI(e.target)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){ down = {x:e.clientX, y:e.clientY, t:performance.now(), moved:0}; canvas.classList.add('drag'); }
  if(pointers.size === 2){ const [a,b] = [...pointers.values()]; pinchD = Math.hypot(a.x-b.x, a.y-b.y); down = null; }
});
window.addEventListener('pointermove', e => {
  hx = e.clientX; hy = e.clientY;
  if(trackDrag){ moveTo(trackPx(e)); return; }
  const p = pointers.get(e.pointerId);
  if(p){
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; lastInput = performance.now();
    if(pointers.size === 1){
      cam.yaw -= dx*.0055; cam.pitch = Math.min(1.5, Math.max(-1.5, cam.pitch + dy*.0055));
      cam.yawV = -dx*.0055*50; cam.pitchV = 0;
      if(down) down.moved += Math.abs(dx) + Math.abs(dy);
    } else if(pointers.size === 2){
      const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinchD > 0) cam.distGoal = clampDist(cam.distGoal*pinchD/d); pinchD = d;
    }
  } else if(e.pointerType === 'mouse' && !onUI(e.target) && !e.target.closest('#track') && !hoverQueued){ hoverQueued = true; requestAnimationFrame(updateHover); }
  const tr = e.target.closest && e.target.closest('#track'); hover = tr ? trackPx(e) : -1;
});
function updateHover(){
  hoverQueued = false;
  const B = pick(hx, hy);
  canvas.classList.toggle('hit', !!B && B !== focus);
  if(B && B !== focus){ labelEl.textContent = B.name; labelEl.style.transform = `translate(${hx+16}px,${hy+10}px)`; labelEl.style.opacity = 1; } else labelEl.style.opacity = 0;
}
function endPointer(e){
  trackDrag = false;
  if(pointers.has(e.pointerId)){
    if(down && pointers.size === 1 && down.moved < 6 && performance.now() - down.t < 600){ const B = pick(e.clientX, e.clientY); if(B) focusOn(B); }
    pointers.delete(e.pointerId); if(pointers.size < 2) pinchD = 0; if(!pointers.size){ canvas.classList.remove('drag'); down = null; }
  }
}
window.addEventListener('pointerup', endPointer); window.addEventListener('pointercancel', endPointer);
window.addEventListener('pointerleave', () => { hover = -1; labelEl.style.opacity = 0; });
track.addEventListener('pointerleave', () => { hover = -1; });
window.addEventListener('wheel', e => {
  if(e.target.closest && e.target.closest('#panel')) return;
  e.preventDefault(); lastInput = performance.now();
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(e.target.closest && e.target.closest('#track')) moveTo(x + d*(e.deltaMode === 1 ? .012 : .00075));
  else cam.distGoal = clampDist(cam.distGoal*Math.exp(d*(e.deltaMode === 1 ? .02 : .0012)));
}, {passive:false});
window.addEventListener('keydown', e => {
  const k = e.key;
  if(k === 'ArrowRight' || k === 'ArrowDown'){ e.preventDefault(); moveTo(focus ? (parentIdx(focus)+1)/LAST : 0); }
  else if(k === 'ArrowLeft' || k === 'ArrowUp'){ e.preventDefault(); moveTo(focus ? (parentIdx(focus)-1)/LAST : 0); }
  else if(k === 'Escape') toOverview();
  else if(k === ' '){ e.preventDefault(); paused = !paused; }
});

/* ---------- Loop ---------- */
function resize(){
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  if(focus) cam.distGoal = clampDist(cam.distGoal); else cam.distGoal = overviewDist();
}
window.addEventListener('resize', resize); resize();
cam.dist = overviewDist()*3.4;
const t0 = performance.now(); let last = t0;
const zero = new THREE.Vector3(), fp = new THREE.Vector3(), lookP = new THREE.Vector3(), dirV = new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now;
  const time = now/1000, fk = r => 1 - Math.exp(-dt*r);
  U.t.value = time; U.fade.value = Math.min(1, (now - t0)/900);
  if(!paused) simT += dt;
  U.st.value = simT; U.evo.value += dt*1.1;
  U.flick.value = 1 + .1*Math.sin(time*2.1) + .06*Math.sin(time*5.3);
  updateScene(simT, focus, dt);
  sunMesh.rotation.y += dt*.03; dustGroup.rotation.y += dt*.004; halo.quaternion.copy(camera.quaternion);

  // camera: follow the focused body, orbit with inertia, ease distance in log space
  if(focus) bodyWorldPos(focus, fp); else fp.copy(zero);
  if(focus && prevFocus === focus) cam.target.add(tmpV.subVectors(fp, prevFocusPos));
  prevFocus = focus; prevFocusPos.copy(fp);
  cam.target.lerp(fp, fk(focus ? 4.5 : 3));
  if(!pointers.size){ cam.yaw += cam.yawV*dt; cam.yawV *= Math.exp(-dt*3.2); }
  if(!focus && !pointers.size && !REDUCED && now - lastInput > 4000) cam.yaw += dt*.035;
  cam.dist = Math.exp(Math.log(cam.dist) + (Math.log(cam.distGoal) - Math.log(cam.dist))*fk(3));
  const wide = !narrow();
  cam.sx += ((focus && wide ? cam.dist*.2 : 0) - cam.sx)*fk(3);
  cam.sy += ((focus && !wide ? cam.dist*.2 : 0) - cam.sy)*fk(3);
  const cp = Math.cos(cam.pitch);
  dirV.set(Math.sin(cam.yaw)*cp, Math.sin(cam.pitch), Math.cos(cam.yaw)*cp);
  const rl = Math.hypot(dirV.x, dirV.z) || 1;
  lookP.set(cam.target.x + dirV.z/rl*cam.sx, cam.target.y - cam.sy, cam.target.z - dirV.x/rl*cam.sx);
  camera.position.copy(lookP).addScaledVector(dirV, cam.dist); camera.lookAt(lookP);

  // pick spheres stay easy to hit at any zoom
  pickables.forEach(pk => { const B = pk.userData.body; if(B.id === 'sun'){ pk.scale.setScalar(B.r); return; }
    const d = camera.position.distanceTo(pk.position), base = B.moon ? B.r*1.3 : B.obj.pickR;
    pk.scale.setScalar(Math.max(base, d*.017)); });

  // ticks
  focusAmt += ((focus ? 1 : 0) - focusAmt)*fk(8);
  const active = x*(N-1), bellAt = (hover >= 0 ? hover : (focus ? x : -9))*(N-1);
  for(let j=0;j<N;j++){
    const q = j - bellAt, bell = Math.exp(-q*q/5.5), on = Math.exp(-(j-active)*(j-active)/.22)*focusAmt;
    const goal = Math.max((j % PER ? .17 : .28) + bell*.55, on);
    tickH[j] += (goal - tickH[j])*fk(22);
    ticks[j].style.transform = `scaleY(${tickH[j].toFixed(3)})`; ticks[j].style.opacity = (.3 + bell*.35 + on*.6).toFixed(3);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
setTimeout(() => $('hint').classList.add('gone'), 9000);
</script>
